<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI VS YOU - SMAN 1 Bululawang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --primary: #0ea5e9; 
            --primary-dark: #0284c7;
            --surface: rgba(255, 255, 255, 0.9);
            --bg-app: #f1f5f9;
        }

        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-app);
            color: #1E293B;
            overscroll-behavior-y: none;
            margin: 0;
            padding: 0;
        }

        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 1.25rem;
        }

        .modern-input {
            width: 100%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .modern-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1); background: #fff; }
        
        .modern-btn { border-radius: 0.75rem; transition: all 0.2s; font-weight: 600; }
        .modern-btn:active { transform: scale(0.97); }

        .nav-dock {
            position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); width: calc(100% - 2rem);
            max-width: 500px; z-index: 50; background: white;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            border-radius: 1.5rem; display: flex; justify-content: space-around; padding: 0.5rem; border: 1px solid #f1f5f9;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0.5rem; border-radius: 1rem; color: #94a3b8; transition: all 0.2s ease;
            cursor: pointer; flex: 1; text-align: center;
        }

        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.25rem; margin-bottom: 2px; transition: transform 0.2s; }
        .nav-item.active i { transform: translateY(-2px); }
        .nav-item span { font-size: 0.65rem; font-weight: 700; }

        .static-header {
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            color: white; padding: 1.5rem 1rem 2rem 1rem; text-align: center;
            border-bottom-left-radius: 2rem; border-bottom-right-radius: 2rem;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2);
            position: sticky; top: 0; z-index: 40;
        }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .star-rating i { cursor: pointer; color: #cbd5e1; transition: color 0.2s; }
        .star-rating i.active { color: #f59e0b; }

        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        #toast-container { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; width: 90%; max-width: 400px; }
        .toast { padding: 1rem; border-radius: 1rem; background: #1e293b; color: white; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 0.75rem; animation: slideDown 0.3s ease-out forwards; font-size: 0.875rem; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            .no-print { display: none !important; }
            .static-header { border-radius: 0; padding: 1rem; box-shadow: none; background: white; color: black; border-bottom: 2px solid black; }
            .static-header * { color: black !important; }
            body { background: white; }
            .glass-card { box-shadow: none; border: none; }
            .print-break { page-break-before: always; }
            .print-table { width: 100%; border-collapse: collapse; }
            .print-table th, .print-table td { border: 1px solid black; padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="toast-container" class="no-print"></div>
    <div id="modal-container" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm no-print"></div>
    
    <div class="max-w-md mx-auto bg-slate-50 min-h-screen relative shadow-2xl overflow-hidden pb-24" id="app-wrapper"></div>

    <script>
        const mockDB = {
            systemSettings: { appName: "AI VS YOU", schoolName: "SMA NEGERI 1 BULULAWANG", address: "Jalan Raya Bululawang Nomor 17 Bululawang 65171", phone: "0341-804010", kepsekName: "NYARIADI, S.Pd", kepsekNip: "197106151998031011" },
            users: [
                { id: 'admin1', username: 'admin', password: '123', role: 'admin', name: 'Administrator IT' },
                { id: 'guru1', username: 'guru', password: '123', role: 'guru', name: 'Drs. HARTONO', mapel: 'Fisika' },
                { id: 'siswa1', username: 'siswa', password: '123', role: 'siswa', name: 'Ahmad Faisal', kelas: 'X-1', nis: '1001' },
                { id: 'siswa2', username: 'siswa2', password: '123', role: 'siswa', name: 'Budi Santoso', kelas: 'X-1', nis: '1002' }
            ],
            kelasData: ['X-1', 'X-2', 'XI-IPA-1'],
            mapelData: ['Fisika', 'Bahasa Indonesia', 'Sejarah'],
            aktivitas: [
                { id: 'A001', tipe: 'cek_ai', guruId: 'guru1', judul: 'Analisis Gravitasi', mapel: 'Fisika', kelas: 'X-1', teksAI: 'Gaya gravitasi di bumi sama di semua tempat.', aiDigunakan: 'ChatGPT', tanggal: '2026-09-24' },
                { id: 'A002', tipe: 'logbook', guruId: 'guru1', judul: 'Logbook Proyek Roket Air', mapel: 'Fisika', kelas: 'X-1', tanggal: '2026-09-25' },
                { id: 'A003', tipe: 'refleksi', guruId: 'guru1', judul: 'Refleksi Akhir Bab Mekanika', mapel: 'Fisika', kelas: 'X-1', tanggal: '2026-09-26' }
            ],
            submisi: [
                 { id: 'SUB1', aktivitasId: 'A001', siswaId: 'siswa1', status: 'dinilai', nilai: 4, feedback: 'Bagus.', sumberJenis: 'web', klaim: 'Salah', teksBukti: 'Gravitasi berbeda di ekuator dan kutub.', sumberDetail: { url: 'https://fisika.com' } },
                 { id: 'SUB2', aktivitasId: 'A001', siswaId: 'siswa2', status: 'dinilai', nilai: 2, feedback: 'Kurang tepat.', sumberJenis: 'buku', klaim: 'Benar', teksBukti: 'Buku bilang sama.', sumberDetail: { judul: 'Buku Paket Fisika', pengarang: 'Kemdikbud' } }
            ]
        };

        // Helper to get students
        function getSiswaData() { return mockDB.users.filter(u => u.role === 'siswa'); }

        // State Management
        let currentUser = null;
        let currentPage = 'login'; 
        let currentViewData = null; 
        const appWrapper = document.getElementById('app-wrapper');

        let aktivitasTab = 'cek_ai'; // Tabs: cek_ai, logbook, refleksi, hasil
        let laporanTab = 'kelas'; // Tabs: kelas, mapel, individu
        let adminTab = 'user'; // Tabs for pengaturan
        let logbookDraft = []; // Temporary array for logbook entries

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fa-solid fa-check-circle text-green-400"></i>' : 
                         type === 'error' ? '<i class="fa-solid fa-circle-exclamation text-red-400"></i>' : 
                         '<i class="fa-solid fa-info-circle text-blue-400"></i>';
            toast.className = 'toast';
            toast.innerHTML = `${icon} <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; toast.style.transition = 'all 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showModal(title, contentHTML, actionsHTML) {
            const m = document.getElementById('modal-container');
            m.innerHTML = `<div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl relative fade-in">
                <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full bg-slate-50 flex justify-center items-center"><i class="fa-solid fa-times"></i></button>
                <h3 class="text-lg font-bold text-slate-800 mb-4">${title}</h3>
                <div class="mb-6 text-slate-600 text-sm max-h-[60vh] overflow-y-auto">${contentHTML}</div>
                <div class="flex gap-3 justify-end">${actionsHTML}</div></div>`;
            m.classList.remove('hidden');
        }
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function konfirmasi(pesan, callbackYa) {
            showModal('Konfirmasi', pesan, `<button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-500 bg-slate-100">Batal</button>
                <button id="btnConfirmYa" class="px-4 py-2 rounded-xl text-sm font-bold text-white bg-blue-600">Lanjutkan</button>`);
            document.getElementById('btnConfirmYa').onclick = () => { closeModal(); callbackYa(); };
        }

        // CSV Downloader Helper
        function downloadCSV(dataArray, filename) {
            const csvContent = "data:text/csv;charset=utf-8," + dataArray.map(e => e.join(",")).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function render() {
            appWrapper.innerHTML = ''; 
            if (!currentUser) { appWrapper.appendChild(renderLogin()); return; }

            if(currentPage !== 'raporCetak' && currentPage !== 'logbookCetak') appWrapper.appendChild(renderStaticHeader());

            const contentArea = document.createElement('div');
            contentArea.className = 'p-4 fade-in';
            
            switch(currentPage) {
                case 'beranda': contentArea.appendChild(renderDashboard()); break;
                case 'aktivitas': contentArea.appendChild(renderAktivitas()); break;
                case 'buatAktivitasGuru': contentArea.appendChild(renderFormBuatAktivitas()); break;
                case 'detailAktivitasSiswa': contentArea.appendChild(renderDetailAktivitasSiswa(currentViewData)); break;
                
                // Siswa Forms
                case 'formCekAI': contentArea.appendChild(renderFormCekAI(currentViewData)); break;
                case 'formLogbook': contentArea.appendChild(renderFormLogbook(currentViewData)); break;
                case 'formRefleksi': contentArea.appendChild(renderFormRefleksi(currentViewData)); break;
                case 'hasilAktivitasSiswa': contentArea.appendChild(renderHasilAktivitasSiswa(currentViewData)); break;
                case 'logbookCetak': contentArea.appendChild(renderCetakLogbook(currentViewData)); break; 
                
                // Guru Grading
                case 'daftarSubmisiGuru': contentArea.appendChild(renderDaftarSubmisiGuru(currentViewData)); break;
                case 'nilaiSubmisiGuru': contentArea.appendChild(renderFormNilai(currentViewData)); break;
                
                // Laporan & Admin
                case 'laporan': contentArea.appendChild(renderLaporan()); break;
                case 'raporCetak': contentArea.appendChild(renderRaporCetak(currentViewData)); break;
                case 'pengaturan': contentArea.appendChild(renderPengaturanMenu()); break;
                case 'profil': contentArea.appendChild(renderProfil()); break;
                default: contentArea.appendChild(renderDashboard());
            }
            appWrapper.appendChild(contentArea);
            if(currentPage !== 'raporCetak' && currentPage !== 'logbookCetak') appWrapper.appendChild(renderNavbar());
        }

        function navigate(page, data = null) {
            currentPage = page; currentViewData = data; render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function login(u, p) {
            const user = mockDB.users.find(x => x.username === u && x.password === p);
            if (user) { currentUser = user; navigate('beranda'); } else showToast('Username atau Password salah!', 'error');
        }
        function logout() { konfirmasi('Yakin ingin keluar?', () => { currentUser = null; navigate('login'); }); }

        function renderLogin() {
            const div = document.createElement('div');
            div.className = 'min-h-screen flex flex-col items-center justify-center p-6 bg-white relative overflow-hidden';
            div.innerHTML = `
                <div class="absolute inset-0 bg-blue-50/50"></div>
                <div class="w-full max-w-sm z-10 fade-in">
                    <div class="text-center mb-8">
                        <img src="LOGO-1-e1650465835865.png" alt="Logo SMAN 1 Bululawang" class="w-24 h-24 object-contain mx-auto mb-4 drop-shadow-xl" onerror="this.outerHTML='<div class=\\'w-20 h-20 bg-gradient-to-tr from-blue-600 to-cyan-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg text-white\\'><i class=\\'fa-solid fa-shield-halved text-4xl\\'></i></div>'">
                        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">${mockDB.systemSettings.appName}</h1>
                        <p class="text-[10px] font-bold text-blue-600 mt-1 uppercase tracking-widest">${mockDB.systemSettings.schoolName}</p>
                        <p class="text-sm italic font-medium text-slate-500 mt-2">"Don’t Just Ask AI. Challenge It."</p>
                    </div>
                    <div class="glass-card p-6 bg-white shadow-xl">
                        <form id="loginForm" class="flex flex-col gap-4">
                            <div><label class="text-xs font-bold text-slate-500 ml-1">Username / NIS / NIP</label><input type="text" id="username" class="modern-input mt-1" required></div>
                            <div><label class="text-xs font-bold text-slate-500 ml-1">Password</label><input type="password" id="password" class="modern-input mt-1" required></div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-3.5 modern-btn mt-2 shadow-lg">Masuk</button>
                        </form>
                    </div>
                </div>`;
            div.querySelector('#loginForm').addEventListener('submit', (e) => { e.preventDefault(); login(document.getElementById('username').value, document.getElementById('password').value); });
            return div;
        }

        function renderStaticHeader() {
            const header = document.createElement('div');
            header.className = 'static-header no-print flex flex-col items-center justify-center relative overflow-hidden';
            header.innerHTML = `
                <div class="absolute inset-0 opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                <img src="LOGO-1-e1650465835865.png" alt="Logo" class="w-12 h-12 object-contain bg-white rounded-full p-1 border-2 border-white/30 mb-2 z-10 shadow-sm" onerror="this.outerHTML='<div class=\\'w-12 h-12 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center mb-2 z-10 border border-white/30\\'><i class=\\'fa-solid fa-school text-white text-xl\\'></i></div>'">
                <h1 class="text-lg font-black tracking-wide z-10">${mockDB.systemSettings.appName}</h1>
                <h2 class="text-[11px] font-bold tracking-widest uppercase opacity-90 z-10 mt-1">${mockDB.systemSettings.schoolName}</h2>
                <p class="text-[9px] italic font-medium opacity-90 mt-1 z-10 bg-black/10 px-3 py-0.5 rounded-full">Don’t Just Ask AI. Challenge It.</p>
            `;
            return header;
        }

        function renderNavbar() {
            const nav = document.createElement('div'); nav.className = 'nav-dock no-print';
            let items = [{ id: 'beranda', icon: 'fa-house', text: 'Beranda' }, { id: 'aktivitas', icon: 'fa-layer-group', text: 'Aktivitas' }];
            if (['guru', 'admin'].includes(currentUser.role)) items.push({ id: 'laporan', icon: 'fa-chart-pie', text: 'Laporan' });
            if (currentUser.role === 'admin') items.push({ id: 'pengaturan', icon: 'fa-gear', text: 'Sistem' });
            items.push({ id: 'profil', icon: 'fa-user', text: 'Profil' });

            items.forEach(item => {
                const navItem = document.createElement('div');
                const isActive = currentPage === item.id || (item.id === 'aktivitas' && currentPage.includes('Aktivitas') || currentPage.includes('Logbook') || currentPage.includes('Refleksi') || currentPage.includes('Submisi'));
                navItem.className = `nav-item ${isActive ? 'active' : ''}`;
                navItem.innerHTML = `<i class="fa-solid ${item.icon}"></i><span>${item.text}</span>`;
                navItem.onclick = () => navigate(item.id);
                nav.appendChild(navItem);
            });
            return nav;
        }

        function renderDashboard() {
            const div = document.createElement('div'); div.className = 'space-y-5';
            div.innerHTML = `<div class="flex justify-between items-end mb-2"><div><h2 class="text-xl font-extrabold text-slate-800">Halo, ${currentUser.name.split(' ')[0]} 👋</h2><p class="text-slate-500 text-xs mt-1 font-medium capitalize">${currentUser.role} ${currentUser.kelas ? '• Kelas '+currentUser.kelas : ''}</p></div></div>`;

            if (currentUser.role === 'siswa') {
                const submisiKu = mockDB.submisi.filter(s => s.siswaId === currentUser.id && s.status === 'dinilai');
                let avg = submisiKu.length > 0 ? Math.round((submisiKu.reduce((a,c)=>a+c.nilai,0)/submisiKu.length)*20) : 0;
                
                // Active Tasks
                const allTugas = mockDB.aktivitas.filter(a => a.kelas === currentUser.kelas);
                const activeTasks = allTugas.filter(t => !submisiKu.find(s => s.aktivitasId === t.id));

                div.innerHTML += `
                    <div class="glass-card p-5 bg-white">
                        <h3 class="text-sm font-bold text-slate-700 mb-3"><i class="fa-solid fa-chart-line text-blue-500 mr-1"></i> Statistik Pembelajaran</h3>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-center shadow-sm"><p class="text-2xl font-black text-slate-800">${submisiKu.length}</p><p class="text-[9px] font-bold text-slate-400 uppercase">Misi Selesai</p></div>
                            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 text-center shadow-sm"><p class="text-2xl font-black text-blue-600">${avg}</p><p class="text-[9px] font-bold text-blue-400 uppercase">Rata-rata Nilai</p></div>
                        </div>
                    </div>
                    
                    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2 mt-4"><i class="fa-solid fa-fire text-orange-500"></i> Tugas Aktif Baru</h3>
                    ${activeTasks.length === 0 ? `<div class="text-center p-6 bg-white rounded-xl border border-slate-100 text-slate-400 text-sm shadow-sm">Semua tugas telah diselesaikan. Kerja bagus!</div>` : ''}
                    <div class="space-y-3">
                        ${activeTasks.map(t => `
                            <div onclick="navigate('detailAktivitasSiswa', '${t.id}')" class="bg-white p-4 rounded-xl border-l-4 ${t.tipe==='cek_ai'?'border-l-blue-500':t.tipe==='logbook'?'border-l-green-500':'border-l-orange-500'} shadow-sm cursor-pointer hover:bg-slate-50 transition">
                                <div class="flex justify-between mb-1"><span class="text-[10px] font-bold text-slate-500 uppercase tracking-wide">${t.mapel}</span><span class="text-[10px] bg-red-100 text-red-600 px-2 rounded-full font-bold animate-pulse">Aktif</span></div>
                                <h4 class="font-bold text-slate-800">${t.judul}</h4>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                // Guru & Admin Dashboard Insights
                const totalSiswa = getSiswaData().length;
                const totalKelas = mockDB.kelasData.length;
                const myAktivitas = currentUser.role === 'guru' ? mockDB.aktivitas.filter(a => a.guruId === currentUser.id) : mockDB.aktivitas;
                const totalSubmisi = mockDB.submisi.length;
                
                div.innerHTML += `
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="glass-card p-4 bg-white text-center shadow-sm"><i class="fa-solid fa-users text-blue-500 text-2xl mb-2"></i><p class="text-2xl font-black text-slate-800">${totalSiswa}</p><p class="text-[10px] font-bold text-slate-400 uppercase">Total Siswa</p></div>
                        <div class="glass-card p-4 bg-white text-center shadow-sm"><i class="fa-solid fa-layer-group text-purple-500 text-2xl mb-2"></i><p class="text-2xl font-black text-slate-800">${myAktivitas.length}</p><p class="text-[10px] font-bold text-slate-400 uppercase">Total Aktivitas</p></div>
                        <div class="glass-card p-4 bg-white text-center shadow-sm col-span-2"><p class="text-xl font-black text-green-600">${totalSubmisi}</p><p class="text-[10px] font-bold text-slate-400 uppercase">Respon Tugas Terkumpul</p></div>
                    </div>
                `;
            }
            return div;
        }

        function renderAktivitas() {
            const div = document.createElement('div');
            div.className = 'space-y-4 pb-4';
            
            // Tombol Buat Aktivitas untuk Guru
            if (currentUser.role === 'guru') {
                div.innerHTML += `<button onclick="navigate('buatAktivitasGuru')" class="w-full bg-blue-600 text-white font-bold py-3.5 modern-btn shadow-md flex justify-center items-center gap-2 mb-4 hover:bg-blue-700"><i class="fa-solid fa-plus"></i> Buat Aktivitas Baru</button>`;
            }

            // Kategori Grid Card
            const tabs = [
                { id: 'cek_ai', label: 'Cek AI', icon: 'fa-magnifying-glass-chart', color: 'blue' },
                { id: 'logbook', label: 'Logbook', icon: 'fa-book-journal-whills', color: 'green' },
                { id: 'refleksi', label: 'Refleksi', icon: 'fa-brain', color: 'orange' }
            ];
            if(currentUser.role !== 'siswa') tabs.push({ id: 'hasil', label: 'Cek Hasil', icon: 'fa-clipboard-check', color: 'purple' });

            let capsuleHtml = `<div class="grid grid-cols-2 gap-3 mb-4">`;
            tabs.forEach(t => {
                const active = aktivitasTab === t.id;
                capsuleHtml += `
                    <div onclick="aktivitasTab='${t.id}'; render();" class="glass-card p-3 flex flex-col items-center justify-center cursor-pointer transition-all ${active ? `bg-${t.color}-500 text-white border-transparent` : `bg-white text-slate-600 hover:bg-slate-50`} shadow-sm">
                        <i class="fa-solid ${t.icon} text-2xl mb-1 ${active ? 'text-white' : `text-${t.color}-500`}"></i>
                        <span class="text-xs font-bold">${t.label}</span>
                    </div>`;
            });
            capsuleHtml += `</div>`;
            div.innerHTML += capsuleHtml;

            // List Konten
            let listTugas = [];
            if (currentUser.role === 'siswa') listTugas = mockDB.aktivitas.filter(a => a.kelas === currentUser.kelas);
            else if (currentUser.role === 'guru') listTugas = mockDB.aktivitas.filter(a => a.guruId === currentUser.id);
            else listTugas = mockDB.aktivitas; 

            if(aktivitasTab !== 'hasil') listTugas = listTugas.filter(a => a.tipe === aktivitasTab);

            if(listTugas.length === 0) {

        window.generateLaporan = (format) => {
            if(laporanTab === 'individu') {
                const siswaId = document.getElementById('lapSiswa').value;
                const mapel = document.getElementById('lapMapel') ? document.getElementById('lapMapel').value : '';
                if(!siswaId) { showToast('Pilih siswa terlebih dahulu!', 'error'); return; }
                
                if(format === 'pdf') navigate('raporCetak', { siswaId, mapel });
                else {
                    const siswa = mockDB.users.find(u => u.id === siswaId);
                    let subSiswa = mockDB.submisi.filter(s => s.siswaId === siswa.id && s.status === 'dinilai');
                    if(mapel) { const aktIds = mockDB.aktivitas.filter(a => a.mapel === mapel).map(a => a.id); subSiswa = subSiswa.filter(s => aktIds.includes(s.aktivitasId)); }
                    
                    let csvData = [ ["No", "Judul Tugas", "Tipe", "Nilai (Skala 100)"] ];
                    subSiswa.forEach((s, idx) => {
                        const akt = mockDB.aktivitas.find(a => a.id === s.aktivitasId);
                        csvData.push([idx+1, `"${akt.judul}"`, akt.tipe, s.nilai*20]);
                    });
                    downloadCSV(csvData, `Rapor_${siswa.name.replace(/\s+/g, '_')}.csv`);
                    showToast(`Data Individu CSV diunduh.`, 'success');
                }
            } else {
                // Kelas or Mapel export mock
                let filterKelas = document.getElementById('lapKelas') ? document.getElementById('lapKelas').value : '';
                let filterMapel = document.getElementById('lapMapel') ? document.getElementById('lapMapel').value : '';
                
                if(format === 'pdf') {
                    showToast('Preview PDF Kelas/Mapel disimulasikan.', 'info');
                } else {
                    let csvData = [ ["Nama Siswa", "Kelas", "Aktivitas", "Mapel", "Nilai"] ];
                    mockDB.submisi.forEach(s => {
                        if(s.status !== 'dinilai') return;
                        const akt = mockDB.aktivitas.find(a => a.id === s.aktivitasId);
                        const siswa = mockDB.users.find(u => u.id === s.siswaId);
                        if(filterKelas && siswa.kelas !== filterKelas) return;
                        if(filterMapel && akt.mapel !== filterMapel) return;
                        csvData.push([`"${siswa.name}"`, siswa.kelas, `"${akt.judul}"`, akt.mapel, s.nilai*20]);
                    });
                    downloadCSV(csvData, `Rekap_Nilai_${Date.now()}.csv`);
                    showToast('Data CSV berhasil diunduh.', 'success');
                }
            }
        };

                    <span class="text-[9px] font-bold px-2 py-1 rounded bg-white/20 text-white uppercase tracking-wider mb-2 inline-block">${tugas.tipe === 'cek_ai'?'Cek Fakta':tugas.tipe==='logbook'?'Logbook':'Refleksi'}</span>
                    <h2 class="font-black text-base leading-tight mb-1">${tugas.judul}</h2>
                    <span class="text-[10px] font-medium text-slate-300">Kelas ${tugas.kelas} • ${subs.length} Kumpulan</span>
                </div>
                <div class="space-y-2 -mt-6">
            `;
            if(subs.length === 0) html += `<div class="p-6 text-center text-sm font-medium text-slate-400 bg-white rounded-2xl border border-slate-100 shadow-sm mx-1">Belum ada siswa yang mengumpulkan.</div>`;
            else {
                subs.forEach(s => {
                    const siswa = mockDB.users.find(u => u.id === s.siswaId);
                    const isN = s.status === 'dinilai';
                    let ringkasan = '';
                    if(tugas.tipe === 'cek_ai') ringkasan = `Klaim: <span class="${s.klaim === 'Benar' ? 'text-green-600':'text-red-600'} font-black">${s.klaim}</span> | ${s.sumberJenis}`;
                    else if(tugas.tipe === 'logbook') ringkasan = `${s.entries.length} Entri Catatan`;
                    else if(tugas.tipe === 'refleksi') ringkasan = `R1: ${s.r1}`;
                    html += `<div onclick="navigate('nilaiSubmisiGuru', '${s.id}')" class="p-3 bg-white border ${isN ? 'border-slate-100' : 'border-l-4 border-l-red-500 shadow-md'} rounded-xl flex justify-between items-center cursor-pointer transition active:scale-95 mx-1 relative z-10"><div><p class="font-bold text-sm text-slate-800">${siswa ? siswa.name : 'Unknown'}</p><p class="text-[10px] font-medium text-slate-500 mt-0.5">${ringkasan}</p></div>${isN ? `<span class="text-sm font-black text-slate-500 bg-slate-50 px-3 py-1 rounded-lg border border-slate-100">${s.nilai*20}</span>` : `<span class="text-[10px] font-bold text-white bg-red-500 px-3 py-1.5 rounded-lg shadow-sm animate-pulse">Beri Nilai</span>`}</div>`;
                });
            }
            html += `</div>`; div.innerHTML = html; return div;
        }

        function renderFormNilai(submisiId) {
            const sub = mockDB.submisi.find(s => s.id === submisiId); const tugas = mockDB.aktivitas.find(a => a.id === sub.aktivitasId); const siswa = mockDB.users.find(u => u.id === sub.siswaId);
            const div = document.createElement('div'); div.className = 'space-y-4 pb-4';
            let kontenJawaban = '';
            if(tugas.tipe === 'cek_ai') {
                let sDet = sub.sumberDetail; let sHtml = sub.sumberJenis === 'buku' ? `Buku: ${sDet.judul} - ${sDet.pengarang}` : sub.sumberJenis === 'jurnal' ? `Jurnal: ${sDet.judul} (${sDet.tahun}) - ${sDet.penulis}` : `<a href="${sDet.url}" target="_blank" class="text-blue-500 underline">Buka Tautan</a>`;
                kontenJawaban = `<div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100"><span class="text-[10px] font-bold text-slate-400 uppercase">Kesimpulan Siswa:</span><span class="font-black text-sm px-2 py-0.5 rounded ${sub.klaim === 'Benar' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${sub.klaim}</span></div><div class="mb-2"><span class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Sumber (${sub.sumberJenis}):</span><div class="text-xs bg-white p-2 border border-slate-200 rounded font-medium text-slate-700">${sHtml}</div></div><div><span class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Penjelasan/Kutipan:</span><div class="text-xs text-slate-600 bg-white p-2 border border-slate-200 rounded italic leading-relaxed">${sub.teksBukti}</div></div>`;
            } else if (tugas.tipe === 'logbook') {
                kontenJawaban = `<div class="flex justify-between items-center mb-2"><span class="text-[10px] font-bold text-slate-400 uppercase">Detail Logbook:</span><button onclick="navigate('logbookCetak', '${sub.id}')" class="text-[10px] bg-slate-800 text-white px-2 py-1 rounded font-bold"><i class="fa-solid fa-file-pdf"></i> Lihat PDF</button></div><div class="space-y-2 max-h-60 overflow-y-auto pr-1">${sub.entries.map((e,i) => `<div class="bg-white p-2 rounded border border-slate-200 text-[10px]"><div class="flex justify-between border-b pb-1 mb-1 font-bold"><span>#${i+1} ${e.ai}</span><span>${new Date(e.tgl).toLocaleDateString()}</span></div><p class="mb-1"><span class="font-bold text-blue-600">P:</span> ${e.prompt}</p><p><span class="font-bold text-green-600">Rfl:</span> ${e.ref}</p></div>`).join('')}</div>`;
            } else if (tugas.tipe === 'refleksi') {
                kontenJawaban = `<div class="space-y-3 bg-white p-3 rounded-xl border border-slate-200 text-xs"><div><div class="font-bold text-orange-600 mb-0.5">R1 (Bantuan AI):</div><div class="font-semibold text-slate-700 bg-slate-50 p-1.5 rounded border border-slate-100">${sub.r1}</div></div><div><div class="font-bold text-blue-600 mb-0.5">R2 (Kemampuan Baru):</div><div class="text-slate-600 bg-slate-50 p-1.5 rounded border border-slate-100 leading-relaxed">${sub.r2}</div></div><div><div class="font-bold text-green-600 mb-0.5">R3 (Kemandirian Tanpa AI):</div><div class="text-slate-600 bg-slate-50 p-1.5 rounded border border-slate-100 leading-relaxed">${sub.r3}</div></div></div>`;
            }
            div.innerHTML = `
                <button onclick="navigate('daftarSubmisiGuru', '${tugas.id}')" class="text-slate-500 text-sm font-bold flex items-center gap-2 mb-2"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
                <div class="glass-card p-5 bg-white shadow-lg">
                    <div class="flex items-center gap-3 border-b border-slate-100 pb-3 mb-4">
                        <div class="w-10 h-10 bg-gradient-to-br from-blue-100 to-blue-200 rounded-full flex items-center justify-center font-black text-blue-600 text-lg shadow-inner">${siswa.name.charAt(0)}</div>
                        <div><h3 class="font-black text-slate-800 text-sm">${siswa.name}</h3><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">${siswa.kelas} • NIS: ${siswa.nis}</p></div>
                    </div>
                    <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl mb-6 shadow-inner">${kontenJawaban}</div>
                    <form id="formPenilaian" class="space-y-5 border-t border-slate-100 pt-4">
                        <div class="text-center bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                            <label class="block text-xs font-bold text-yellow-800 mb-2 uppercase tracking-wider">Berikan Penilaian Bintang</label>
                            <div class="flex justify-center gap-3 text-4xl star-rating" id="starContainer">${[1,2,3,4,5].map(i => `<i class="fa-solid fa-star drop-shadow-sm" data-val="${i}"></i>`).join('')}</div>
                            <input type="hidden" id="nInput" value="${sub.nilai || 0}">
                            <div class="mt-3 text-xs font-bold text-slate-500 bg-white inline-block px-4 py-1 rounded-full shadow-sm">Skala 100: <span id="nDisp" class="text-slate-900 text-lg font-black">${sub.nilai ? sub.nilai*20 : 0}</span></div>
                        </div>
                        <div><label class="block text-xs font-bold text-slate-700 mb-1">Catatan/Feedback (Opsional)</label><textarea id="feedback" rows="2" class="modern-input text-sm" placeholder="Berikan saran atau apresiasi...">${sub.feedback || ''}</textarea></div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3.5 modern-btn shadow-md text-sm"><i class="fa-solid fa-check mr-1"></i> Simpan Penilaian</button>
                    </form>
                </div>
            `;
            setTimeout(() => {
                const stars = div.querySelectorAll('#starContainer i'); const nInput = div.querySelector('#nInput'); const nDisp = div.querySelector('#nDisp');
                const updateStars = (val) => { stars.forEach(s => s.classList.remove('active', 'scale-110')); stars.forEach((s, idx) => { if(idx < val) s.classList.add('active', 'scale-110'); }); }
                if(sub.nilai > 0) updateStars(sub.nilai);
                stars.forEach(star => { star.addEventListener('click', function() { const val = parseInt(this.getAttribute('data-val')); nInput.value = val; nDisp.innerText = val * 20; updateStars(val); }); });
                div.querySelector('#formPenilaian').addEventListener('submit', (e) => { e.preventDefault(); if(nInput.value == 0) { showToast('Silakan beri minimal 1 bintang.', 'error'); return; } sub.nilai = parseInt(nInput.value); sub.feedback = document.getElementById('feedback').value; sub.status = 'dinilai'; showToast('Penilaian berhasil disimpan!'); navigate('daftarSubmisiGuru', tugas.id); });
            }, 0);
            return div;
        }

        function renderRaporCetak(data) {
            const siswa = mockDB.users.find(s => s.id === data.siswaId);
            const div = document.createElement('div'); div.className = 'bg-white min-h-screen relative p-6 pb-20 no-print-bg text-black';
            
            let subSiswa = mockDB.submisi.filter(s => s.siswaId === siswa.id && s.status === 'dinilai');
            if(data.mapel) { const aktIds = mockDB.aktivitas.filter(a => a.mapel === data.mapel).map(a => a.id); subSiswa = subSiswa.filter(s => aktIds.includes(s.aktivitasId)); }

            let rows = ''; let tot = 0;
            if(subSiswa.length === 0) rows = `<tr><td colspan="5" class="text-center p-4 border">Belum ada data nilai.</td></tr>`;
            else {
                subSiswa.forEach((s, idx) => {
                    const akt = mockDB.aktivitas.find(a => a.id === s.aktivitasId); tot += (s.nilai*20);
                    let info = akt.tipe === 'cek_ai' ? 'Cek Fakta AI' : akt.tipe === 'logbook' ? 'Logbook AI' : 'Refleksi';
                    rows += `<tr><td class="border p-2 text-center">${idx+1}</td><td class="border p-2">${akt.judul}<br><small>${akt.mapel}</small></td><td class="border p-2 text-center">${info}</td><td class="border p-2 text-center font-bold">${s.nilai*20}</td></tr>`;
                });
            }
            const avg = subSiswa.length > 0 ? Math.round(tot/subSiswa.length) : 0;
            
            div.innerHTML = `
                <div class="no-print fixed bottom-4 left-1/2 transform -translate-x-1/2 flex gap-3 z-50">
                    <button onclick="navigate('laporan')" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg">Kembali</button>
                    <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg"><i class="fa-solid fa-print"></i> Print PDF</button>
                </div>
                <div class="border-b-4 border-double border-black pb-4 mb-6 text-center">
                    <h2 class="font-black text-xl uppercase">${mockDB.systemSettings.appName}</h2>
                    <h3 class="font-bold text-lg uppercase">${mockDB.systemSettings.schoolName}</h3>
                    <p class="text-xs">${mockDB.systemSettings.address} | Telp: ${mockDB.systemSettings.phone}</p>
                </div>
                <h3 class="text-center font-bold text-lg mb-6 underline">RAPOR LITERASI DIGITAL AI</h3>
                <div class="flex justify-between text-sm mb-6">
                    <table class="border-none"><tr><td class="pr-2">Nama</td><td>: ${siswa.name}</td></tr><tr><td>NIS</td><td>: ${siswa.nis}</td></tr><tr><td>Kelas</td><td>: ${siswa.kelas}</td></tr></table>
                    <table class="border-none"><tr><td class="pr-2">Mapel</td><td>: ${data.mapel || 'Semua'}</td></tr><tr><td>Rata-rata</td><td class="font-bold">: ${avg}/100</td></tr></table>
                </div>
                <table class="print-table mb-10 w-full text-left">
                    <tr class="bg-gray-200"><th class="w-10 text-center">No</th><th>Topik Aktivitas</th><th class="w-24 text-center">Tipe Tugas</th><th class="w-16 text-center">Nilai</th></tr>
                    ${rows}
                </table>
                <div class="flex justify-between text-sm pt-8 print-break-avoid">
                    <div class="text-center w-1/2"><p class="mb-16">Mengetahui,<br>Kepala Sekolah</p><p class="font-bold underline">${mockDB.systemSettings.kepsekName}</p><p>NIP. ${mockDB.systemSettings.kepsekNip}</p></div>
                    <div class="text-center w-1/2"><p class="mb-16">Bululawang, ${new Date().toLocaleDateString('id-ID')}<br>Guru Mata Pelajaran</p><p class="font-bold underline">${currentUser.role === 'guru' ? currentUser.name : '(........................................)'}</p></div>
                </div>
            `;
            return div;
        }

        function renderCetakLogbook(submisiId) {
            const sub = mockDB.submisi.find(s => s.id === submisiId); const akt = mockDB.aktivitas.find(a => a.id === sub.aktivitasId); const siswa = mockDB.users.find(u => u.id === sub.siswaId);
            const div = document.createElement('div'); div.className = 'bg-white min-h-screen p-6 no-print-bg text-black';
            let rows = sub.entries.map(e => `<tr><td class="border border-black p-2 align-top text-xs">${new Date(e.tgl).toLocaleString('id-ID')}</td><td class="border border-black p-2 align-top text-xs">${e.ai}</td><td class="border border-black p-2 align-top text-xs">${e.prompt}</td><td class="border border-black p-2 align-top text-xs">${e.res}</td><td class="border border-black p-2 align-top text-xs">${e.ref}</td></tr>`).join('');
            div.innerHTML = `
                <div class="no-print fixed bottom-4 left-1/2 transform -translate-x-1/2 flex gap-3 z-50">
                    <button onclick="${currentUser.role==='siswa' ? `navigate('hasilAktivitasSiswa','${sub.id}')` : `navigate('nilaiSubmisiGuru','${sub.id}')`}" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg">Kembali</button>
                    <button onclick="window.print()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg"><i class="fa-solid fa-print"></i> Print PDF</button>
                </div>
                <div class="font-sans mb-6 text-sm"><p class="font-bold text-base mb-2">Logbook Penggunaan AI</p><table class="border-none mb-4"><tr><td class="pr-2">Judul Aktivitas</td><td>: ${akt.judul}</td></tr><tr><td class="pr-2 align-top">Nama Peserta</td><td>: 1. ${siswa.name} (${siswa.kelas})<br>&nbsp;&nbsp;2. ____________________</td></tr></table></div>
                <table class="w-full border-collapse border border-black mb-8"><tr class="bg-gray-100"><th class="border border-black p-2 text-left text-xs w-[15%]">Tanggal dan Waktu</th><th class="border border-black p-2 text-left text-xs w-[15%]">AI yang digunakan</th><th class="border border-black p-2 text-left text-xs w-[25%]">Prompt / Pertanyaan</th><th class="border border-black p-2 text-left text-xs w-[25%]">Response AI</th><th class="border border-black p-2 text-left text-xs w-[20%]">Implementasi & Refleksi</th></tr>${rows}</table>
            `;
            return div;
        }

        render();
    </script>
</body>
</html>
